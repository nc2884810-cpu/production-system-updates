<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учёт производства</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="page-header">
            <div>
                <h1>Мини-система учёта производства</h1>
                <p class="date" id="currentDate">Сегодня: —</p>
            </div>
            <span class="version-badge" id="appVersion">Версия: —</span>
        </header>

        <section class="statistics" aria-label="Статистика производства">
            <div class="stat-card">
                <span class="stat-title">Всего произведено</span>
                <strong id="totalProduced">0</strong>
            </div>
            <div class="stat-card">
                <span class="stat-title">Годных</span>
                <strong id="totalGood">0</strong>
            </div>
            <div class="stat-card">
                <span class="stat-title">Брак</span>
                <strong id="totalDefect">0</strong>
            </div>
            <div class="stat-card">
                <span class="stat-title">Процент брака</span>
                <strong id="totalDefectPercent">0.00%</strong>
            </div>
        </section>

        <section class="actions">
            <button id="addProductionButton" type="button">+ Добавить производство</button>
        </section>

        <section class="production-list">
            <div class="section-heading">
                <div>
                    <h2>Последние операции</h2>
                    <p class="section-note" id="storageStatus">Подключение к хранилищу...</p>
                </div>
            </div>

            <p class="empty-message" id="emptyMessage">
                Производственных записей пока нет.
            </p>

            <div class="table-wrapper" id="productionTableWrapper" hidden>
                <table class="production-table">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Изделие</th>
                            <th>Всего</th>
                            <th>Годных</th>
                            <th>Брак</th>
                            <th>Брак, %</th>
                            <th>Причина брака</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="productionTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="productionModal" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="productionModalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="productionModalTitle">Добавить производство</h2>
                <button id="closeModalButton" class="close-button" type="button" aria-label="Закрыть">×</button>
            </div>

            <form id="productionForm">
                <label>
                    Изделие
                    <input type="text" id="productName" maxlength="200" placeholder="Например: ABC-001" autocomplete="off" required>
                </label>

                <label>
                    Количество
                    <input type="number" id="quantity" min="1" step="1" placeholder="Например: 50" required>
                </label>

                <label>
                    Годных
                    <input type="number" id="goodQuantity" min="0" step="1" placeholder="Например: 47" required>
                </label>

                <label>
                    Брак
                    <input type="number" id="defectQuantity" min="0" step="1" placeholder="Например: 3" required>
                </label>

                <label>
                    Причина брака
                    <textarea id="defectReason" rows="3" maxlength="2000" placeholder="Например: дефект корпуса"></textarea>
                </label>

                <div id="formMessage" class="form-message" aria-live="polite"></div>

                <div class="form-actions">
                    <button type="button" id="cancelButton" class="secondary-button">Отмена</button>
                    <button type="submit" id="submitProductionButton">Добавить запись</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
